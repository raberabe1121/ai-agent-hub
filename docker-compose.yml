services:
  worker:
    build: .
    command: python -m ai_agent_hub.agent_worker
    environment:
      AI_AGENT_HUB_QUEUE_DIR: /data/queue
      AI_AGENT_HUB_PROCESSED_DIR: /data/processed
      AI_AGENT_HUB_STORAGE: sqlite
      AI_AGENT_HUB_SQLITE_PATH: /data/agent_hub.db
      AI_AGENT_HUB_APPROVAL_DB: /data/approvals.db
      LLM_PROVIDER: ollama
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./data:/data
    networks:
      - agent-net

  api:
    build: .
    command: python -m ai_agent_hub.api_server
    ports:
      - "8080:8080"
    environment:
      AI_AGENT_HUB_QUEUE_DIR: /data/queue
      AI_AGENT_HUB_PROCESSED_DIR: /data/processed
      AI_AGENT_HUB_STORAGE: sqlite
      AI_AGENT_HUB_SQLITE_PATH: /data/agent_hub.db
    volumes:
      - ./data:/data
    depends_on:
      - worker
    networks:
      - agent-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_HUB_API_URL=http://api:8080
    depends_on:
      - api
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  data:
