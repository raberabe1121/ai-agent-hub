services:
  postfix:
    image: boky/postfix
    environment:
      ALLOWED_SENDER_DOMAINS: localhost
      RELAYHOST: ""
    ports:
      - "25:25"
    volumes:
      - ./docker/postfix-main.cf:/etc/postfix/main.cf:ro
    networks:
      - agent-net

  lmtp:
    build: .
    command: python -m ai_agent_hub.lmtp_server
    environment:
      AI_AGENT_HUB_QUEUE_DIR: /data/queue
      AI_AGENT_HUB_PROCESSED_DIR: /data/processed
      AI_AGENT_HUB_STORAGE: sqlite
      AI_AGENT_HUB_SQLITE_PATH: /data/agent_hub.db
    volumes:
      - ./data:/data
    ports:
      - "8024:8024"
    depends_on:
      - postfix
    networks:
      - agent-net

  worker:
    build: .
    command: python -m ai_agent_hub.agent_worker
    environment:
      AI_AGENT_HUB_QUEUE_DIR: /data/queue
      AI_AGENT_HUB_PROCESSED_DIR: /data/processed
      AI_AGENT_HUB_STORAGE: sqlite
      AI_AGENT_HUB_SQLITE_PATH: /data/agent_hub.db
      AI_AGENT_HUB_APPROVAL_DB: /data/approvals.db
      LLM_PROVIDER: ollama
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./data:/data
    depends_on:
      - postfix
      - lmtp
    networks:
      - agent-net

  api:
    build: .
    command: python -m ai_agent_hub.api_server
    ports:
      - "8080:8080"
    environment:
      AI_AGENT_HUB_QUEUE_DIR: /data/queue
      AI_AGENT_HUB_PROCESSED_DIR: /data/processed
      AI_AGENT_HUB_SQLITE_PATH: /data/agent_hub.db
      SMTP_HOST: postfix
      SMTP_PORT: 25
    volumes:
      - ./data:/data
    depends_on:
      - postfix
      - lmtp
      - worker
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  data:
